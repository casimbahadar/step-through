  /* Step Through: a light, quiet page where the only loud thing is the highlighter:
     yellow always means "the machine is here": the running line, the line just
     printed, the task you are on, the lesson you are in. Type is Atkinson
     Hyperlegible (Braille Institute), chosen because it keeps l/1/I, O/0 and quote
     marks distinct: exactly the characters beginners misread. */
  :root{
    --paper:#F2F4F7; --sheet:#FFFFFF; --rule:#D5DAE3; --rule-2:#E6E9EF;
    --ink:#1C2433; --ink-soft:#2E3747; --slate:#5B6577; --slate-2:#575F70;
    --mark:#FFE45C; --mark-soft:#FFF3A8;
    --good:#1F7A4D; --good-bg:#E6F3EC; --bad:#B42318; --bad-bg:#FBEAE8;
    --gold:#8A5E00; --focus:#2742B0;
    --on-mark:#1C2433; --flash:#FFE45C;
    --btn-bg:#1C2433; --btn-fg:#FFFFFF;
    --console:#1C2433; --console-fg:#EEF1F6; --console-ok:#7FD4A6;
    --scrim:rgba(28,36,51,.45);
    --tok-kw:#2742B0; --tok-bi:#6D3894; --tok-str:#1B6B43; --tok-num:#9A4400;
    color-scheme:light dark;
    --mono:"Atkinson Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Atkinson Next",system-ui,-apple-system,"Segoe UI",sans-serif;
    --tap:44px;
  }
  /* Dark: same structure, same single highlighter. Text that sits ON the yellow
     band keeps dark ink in both themes (--on-mark), so the band reads identically. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151A23; --sheet:#1C222D; --rule:#323B4A; --rule-2:#262E3A;
      --ink:#E8ECF2; --ink-soft:#C9D0DB; --slate:#A3ACBC; --slate-2:#A3ACBC;
      --mark:#FFE45C; --mark-soft:#FFF3A8; --flash:#5A4E14;
      --good:#6BCB97; --good-bg:#15301F; --bad:#FF8A7A; --bad-bg:#3A1C19;
      --gold:#E8C35A; --focus:#9DB2FF;
      --btn-bg:#E8ECF2; --btn-fg:#151A23;
      --console:#0F131A; --console-fg:#E8ECF2; --console-ok:#7FD4A6;
      --scrim:rgba(0,0,0,.6);
      --tok-kw:#9DB2FF; --tok-bi:#D6A6F2; --tok-str:#7FD4A6; --tok-num:#F2B27A;
    }
  }

      --ink:#E8ECF2; --ink-soft:#C9D0DB; --slate:#A3ACBC; --slate-2:#A3ACBC;
      --mark:#FFE45C; --mark-soft:#FFF3A8; --flash:#5A4E14;
      --good:#6BCB97; --good-bg:#15301F; --bad:#FF8A7A; --bad-bg:#3A1C19;
      --gold:#E8C35A; --focus:#9DB2FF;
      --btn-bg:#E8ECF2; --btn-fg:#151A23;
      --console:#0F131A; --console-fg:#E8ECF2; --console-ok:#7FD4A6;
      --scrim:rgba(0,0,0,.6);
      --tok-kw:#9DB2FF; --tok-bi:#D6A6F2; --tok-str:#7FD4A6; --tok-num:#F2B27A;
    color-scheme:dark;
  }
  :root[data-theme="light"]{color-scheme:light}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
    display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    font-variant-ligatures:none}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  /* small labels: sentence case, never tracked capitals */
  .eyebrow{font-size:13px;font-weight:600;color:var(--slate);letter-spacing:0}

  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper)}
  .mark{display:flex;align-items:baseline;margin-right:auto;min-width:0}
  .mark b{font-size:clamp(16px,5vw,21px);font-weight:750;letter-spacing:-.02em;white-space:nowrap}
  .mark span{display:none}
  select.langsel,.langsel{font-family:var(--mono);font-size:16px;padding:0 10px;min-height:var(--tap);border:1.5px solid var(--rule);
    border-radius:8px;background:var(--sheet);color:var(--ink);appearance:none;text-align:center}
  .iconbtn{border:1.5px solid var(--rule);border-radius:8px;width:var(--tap);height:var(--tap);display:grid;place-items:center;
    font-size:18px;color:var(--ink);background:var(--sheet)}

  /* Learn, Predict, Build is a real sequence, so it is numbered */
  .rail{display:flex;align-items:center;gap:4px;padding:0 10px 8px;background:var(--paper);border-bottom:1.5px solid var(--rule);counter-reset:phase}
  .rail .phase{flex:0 0 auto;counter-increment:phase;font-size:15px;font-weight:600;padding:0 12px;border-radius:8px;
    color:var(--slate);min-height:var(--tap)}
  /* narrow phones: the name, three phases and the score must each stay on one line */
  @media (max-width:360px){ .rail{gap:0} .rail .phase{padding:0 8px} }
  .rail .phase::before{content:counter(phase) "  ";color:var(--slate-2);font-weight:500;white-space:pre}
  .rail .phase[aria-selected="true"]{background:var(--mark);color:var(--on-mark)}
  .rail .phase[aria-selected="true"]::before{color:var(--on-mark)}
  .score{margin-left:auto;display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--slate);padding-right:4px;white-space:nowrap}
  .score b{color:var(--ink);font-size:15px;font-weight:700}
  .score .streak{color:var(--good)}

  .lessonbar{padding:16px 16px 14px;background:var(--paper)}
  .lessonbar h1{margin:2px 0 4px;font-size:26px;line-height:1.15;font-weight:750;letter-spacing:-.02em}
  .lessonbar p{margin:0;font-size:16px;color:var(--slate)}
  /* the standard name, so a learner can search for it once they leave the app */
  .lessonbar p.known{margin-top:6px;font-size:15px}
  .lessonbar p.known b{color:var(--ink);font-weight:700}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  section{display:none;padding:0 0 24px}
  section[data-open="true"]{display:block}

  .teach{padding:6px 16px 4px;max-width:40em}
  .teach .blk{margin-bottom:20px}
  .teach h3{margin:0 0 4px;font-size:17px;line-height:1.3;font-weight:700;color:var(--ink)}
  .teach p{margin:0;font-size:16px;color:var(--ink-soft);line-height:1.6}
  .practice{margin:4px 16px 22px;padding:14px 0 0;border-top:1.5px solid var(--rule);max-width:40em}
  .practice .eyebrow{color:var(--good)}
  .practice h3{margin:2px 0 4px;font-size:17px;font-weight:700}
  .practice p{margin:0;font-size:16px;color:var(--ink-soft);line-height:1.6}
  .cardlabel{padding:0 16px 8px}

  /* the code sheet: white, full bleed, ruled top and bottom */
  .surface{background:var(--sheet);color:var(--ink);border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
  .codelines{font-family:var(--mono);font-size:15.5px;line-height:1.7;padding:10px 0 12px}
  .row{display:flex;align-items:flex-start;padding:0 14px 0 0;position:relative}
  .row .n{flex:0 0 36px;text-align:right;padding-right:12px;color:var(--slate-2);font-size:13px;user-select:none}
  .row .src{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
  /* the running line keeps light-theme syntax colours: they are what reads on yellow */
  .row.lit{background:var(--mark);color:var(--on-mark);
    --tok-kw:#2742B0; --tok-bi:#6D3894; --tok-str:#1B6B43; --tok-num:#9A4400; --slate-2:#575F70}
  .row.lit .n{color:var(--on-mark);font-weight:700}
  .row.errline{background:var(--bad-bg)}
  .row.errline .n{color:var(--bad);font-weight:700}
  .tok-kw{color:var(--tok-kw);font-weight:700}
  .tok-bi{color:var(--tok-bi)}
  .tok-str{color:var(--tok-str)}
  .tok-num{color:var(--tok-num)}
  .tok-com{color:var(--slate-2)}
  .caption{padding:10px 16px 0;color:var(--slate);font-size:14.5px;max-width:40em}

  textarea.editor{width:100%;border:none;resize:none;display:block;background:var(--sheet);color:var(--ink);
    font-family:var(--mono);font-size:16px;line-height:1.7;padding:12px 14px 16px 14px;min-height:30vh}
  .tapedit{display:block;width:100%;text-align:left;padding:0 16px;min-height:var(--tap);background:var(--sheet);
    font-size:14.5px;font-weight:600;color:var(--slate);border-top:1.5px solid var(--rule-2)}

  .quizhead{padding:16px 16px 6px}
  .quizhead .q{font-size:18px;font-weight:700;line-height:1.35}
  .statement{margin:6px 16px 0;padding:14px 16px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);
    font-size:16px;line-height:1.55;color:var(--ink)}
  .options{padding:14px 16px 4px;display:grid;gap:8px}
  .opt{text-align:left;border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--sheet);min-height:52px;
    font-family:var(--mono);font-size:15px;white-space:pre-wrap;line-height:1.5;color:var(--ink)}
  .opt.right{border-color:var(--good);background:var(--good-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .verdict{margin:14px 16px 0;padding:0 0 0 14px;border-left:3px solid var(--rule)}
  .verdict b{display:block;font-size:17px;margin-bottom:2px}
  .verdict.right{border-left-color:var(--good)}
  .verdict.right b{color:var(--good)}
  .verdict.wrong{border-left-color:var(--bad)}
  .verdict.wrong b{color:var(--bad)}
  .verdict p{margin:0;font-size:15.5px;color:var(--ink-soft)}

  .taskhead{padding:14px 16px 12px;position:sticky;top:0;z-index:3;background:var(--paper);border-bottom:1.5px solid var(--rule)}
  .taskhead .p{max-height:26vh;overflow-y:auto;font-size:16.5px;line-height:1.45;color:var(--ink);font-weight:600}
  .dots{display:flex;gap:6px;margin-bottom:10px}
  .dots i{width:26px;height:6px;border-radius:3px;background:var(--rule);display:block}
  .dots i[data-done="true"]{background:var(--good)}
  .dots i[data-current="true"]{background:var(--mark);box-shadow:inset 0 0 0 1.5px var(--on-mark)}
  /* hints are a ladder, so they are numbered */
  .hintbox{margin:12px 16px 0;padding:0;counter-reset:hint}
  .hintbox div{counter-increment:hint;font-size:15.5px;color:var(--ink-soft);margin-bottom:8px;padding-left:64px;position:relative}
  .hintbox div::before{content:"Hint " counter(hint);position:absolute;left:0;top:0;font-weight:700;color:var(--ink)}
  .hintbox div:last-child{margin-bottom:0}

  .panebar{display:flex;gap:6px;padding:8px 12px;background:var(--paper);border-top:1.5px solid var(--rule)}
  .panebar button{font-size:15px;font-weight:600;padding:0 16px;border:1.5px solid var(--rule);border-radius:8px;
    color:var(--slate);min-height:var(--tap);background:var(--sheet)}
  .panebar button[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
  .preview{background:#fff;border-top:1.5px solid var(--rule)}
  .preview iframe{width:100%;height:230px;border:0;display:block;background:#fff}
  .previewlabel{font-size:13px;font-weight:600;color:var(--slate);background:var(--paper);padding:8px 16px}
  .checklist{padding:12px 16px 16px}
  .checkrow{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-bottom:8px;color:var(--ink-soft)}
  .checkrow i{flex:0 0 auto;font-style:normal;font-weight:700;font-size:15px}
  .checkrow.pass i{color:var(--good)}
  .checkrow.fail i{color:var(--bad)}
  .checkrow.fail span{color:var(--bad)}

  /* the text adventure plays in a real console */
  .playout{background:var(--console);padding:14px 16px;max-height:34vh;overflow-y:auto;
    font-family:var(--mono);font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--console-fg)}
  .playout .said{color:var(--mark)}
  .playout .done{color:var(--console-ok)}
  .playbar{display:flex;gap:8px;padding:10px 12px;background:var(--paper);border-top:1.5px solid var(--rule)}
  .playbar input{flex:1;min-width:0;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;
    color:var(--ink);font-family:var(--mono);font-size:16px;padding:0 12px;min-height:var(--tap)}
  .cmpbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);border-top:1.5px solid var(--rule)}
  .cmpbar .langsel{margin-left:auto}
  #compare .codelines{font-size:14px;line-height:1.65;padding:8px 0 10px}
  .viewnote{margin:12px 16px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);
    font-size:15px;color:var(--ink-soft)}

  .tokenbar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--paper);border-top:1.5px solid var(--rule);scrollbar-width:none}
  .tokenbar::-webkit-scrollbar{display:none}
  .tokenbar button{flex:0 0 auto;font-family:var(--mono);font-size:15.5px;padding:0 13px;min-height:var(--tap);min-width:var(--tap);
    border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);white-space:pre}
  .controls{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--paper);border-top:1.5px solid var(--rule);flex-wrap:wrap}
  .primary{background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:16px;padding:0 20px;border-radius:8px;min-height:48px}
  .primary:disabled{opacity:.35}
  .ghost{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:0 15px;font-size:16px;font-weight:600;min-height:48px}
  .ghost:disabled{opacity:.4}
  .danger{border:none;padding:0 10px;font-size:15px;color:var(--slate);min-height:48px;text-decoration:underline;text-underline-offset:3px}

  .stepbar{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;background:var(--paper);border-top:1.5px solid var(--rule)}
  .stepbar input[type=range]{flex:1;min-width:0;accent-color:var(--ink);min-height:var(--tap)}
  .stepbar .sq{width:var(--tap);height:var(--tap);border:1.5px solid var(--rule);border-radius:8px;display:grid;place-items:center;
    font-size:16px;background:var(--sheet);color:var(--ink)}
  .stepmeta{font-size:14px;color:var(--slate);padding:0 14px 8px;background:var(--paper)}

  .readout{border-top:1.5px solid var(--rule);max-height:34vh;overflow-y:auto;background:var(--sheet)}
  .tabs{display:flex;position:sticky;top:0;background:var(--sheet);border-bottom:1.5px solid var(--rule);z-index:1}
  .tabs button{flex:1;min-height:var(--tap);font-size:15px;font-weight:600;color:var(--slate);border-bottom:3px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .panel{padding:12px 16px 16px;display:none}
  .panel[data-open="true"]{display:block}
  .outline{font-family:var(--mono);font-size:15px;white-space:pre-wrap;word-break:break-word;color:var(--ink);padding:1px 8px;margin:0 -8px}
  .outline.justprinted{background:var(--mark);color:var(--on-mark)}
  .empty{color:var(--slate);font-size:15px}
  /* variables read as a ledger, not a stack of cards */
  .slab{display:flex;align-items:baseline;gap:12px;padding:8px 8px;margin:0 -8px;border-bottom:1px solid var(--rule-2)}
  .slab .k{font-family:var(--mono);font-size:15px;color:var(--tok-kw);font-weight:700;min-width:5ch}
  .slab .v{font-family:var(--mono);font-size:15px;color:var(--ink);word-break:break-all}
  .slab.changed{animation:marked 1.2s ease-out}
  @keyframes marked{from{background:var(--flash)}to{background:transparent}}
  .framelabel{font-size:13px;font-weight:600;color:var(--slate);margin:2px 0 6px}
  .note{padding-left:12px;border-left:3px solid var(--rule);font-size:15px;color:var(--ink-soft)}
  .errbox{border-left:3px solid var(--bad);padding-left:12px}
  .errbox b{display:block;font-size:16px;margin-bottom:3px;color:var(--bad)}
  .errbox span{font-size:15px;color:var(--ink-soft)}
  .okbox{border-left:3px solid var(--good);padding-left:12px}
  .okbox b{display:block;font-size:16px;color:var(--good)}
  .stars{font-size:18px;letter-spacing:2px;color:var(--gold)}
  .stars .off{color:var(--rule)}

  .drawer{position:fixed;inset:0;background:var(--scrim);display:none;z-index:10}
  .drawer[data-open="true"]{display:block}
  .drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(360px,90vw);background:var(--paper);
    border-left:1.5px solid var(--rule);overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .drawer h2{font-size:24px;margin:4px 0 10px;font-weight:750;letter-spacing:-.02em}
  .drawer .eyebrow{font-size:17px;font-weight:750;color:var(--ink)}
  .drawer .eyebrow span{font-size:14px;font-weight:500}
  /* lessons are a list, not a pile of cards */
  .lessonitem{display:block;width:100%;text-align:left;padding:11px 10px;margin:0 -10px;width:calc(100% + 20px);
    border-bottom:1px solid var(--rule-2);border-radius:0;min-height:56px}
  .lessonitem[aria-current="true"]{background:var(--mark);border-radius:6px;border-bottom-color:transparent}
  .lessonitem[data-locked="true"] .t{color:var(--slate)}
  .lessonitem .t{font-size:16px;font-weight:700;color:var(--ink)}
  .lessonitem .g{font-size:14px;color:var(--slate)}
  .lessonitem[aria-current="true"] .t,.lessonitem[aria-current="true"] .g,.lessonitem[aria-current="true"] .st{color:var(--on-mark)}
  .lessonitem .st{font-size:13.5px;color:var(--gold);font-weight:600}
  .themepick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .themepick button{flex:1 1 auto;white-space:nowrap;padding:0 14px;min-height:var(--tap);border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);
    font-size:15px;font-weight:600;color:var(--ink)}
  .themepick button[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
  .levelblurb{padding:8px 0 4px;font-size:14.5px;color:var(--good)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="mark"><b>Step Through</b></div>
  <select class="langsel" id="langSel" aria-label="Language"></select>
  <button class="iconbtn" id="btnLessons" aria-label="Lessons">☰</button>
</header>

<div class="rail">
  <button class="phase" id="phLearn" aria-selected="true">Learn</button>
  <button class="phase" id="phPredict">Predict</button>
  <button class="phase" id="phBuild">Build</button>
  <div class="score"><span><b id="xp">0</b> XP</span><span class="streak" id="streak"></span></div>
</div>

<div class="lessonbar">
  <div class="eyebrow" id="lessonEyebrow">Lesson 1</div>
  <h1 id="lessonTitle"></h1>
  <p id="lessonIdea"></p>
  <p id="lessonKnown" class="known" hidden></p>
</div>

<main>
  <section id="secLearn" data-open="true">
    <div class="teach" id="teachBlocks"></div>
    <div class="practice" id="practiceBox"></div>
    <div class="cardlabel eyebrow">Worked example</div>
    <div class="surface">
      <div id="demoCode" class="codelines"></div>
      <div class="caption" id="demoCaption"></div>
    </div>
    <div class="controls">
      <button class="primary" id="btnRunDemo">Run it</button>
      <button class="ghost" id="btnToQuiz">Try the quiz</button>
    </div>
  </section>

  <section id="secPredict">
    <div class="quizhead"><div class="q" id="qPrompt"></div></div>
    <div class="statement" id="qStatement" style="display:none"></div>
    <div class="surface"><div id="qCode" class="codelines"></div></div>
    <div class="options" id="qOptions"></div>
    <div id="qVerdict"></div>
    <div class="controls">
      <button class="primary" id="btnQNext" disabled>Next</button>
      <button class="ghost" id="btnQSkip">Skip to building</button>
    </div>
  </section>

  <section id="secBuild">
    <div class="taskhead">
      <div class="dots" id="taskDots"></div>
      <div class="p" id="taskPrompt"></div>
    </div>
    <div class="surface">
      <div id="buildCode" class="codelines"></div>
      <textarea class="editor" id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" style="display:none"></textarea>
      <button class="tapedit" id="tapEdit">Tap to edit</button>
    </div>
    <div id="hintBox"></div>
  </section>
  <section id="secMarkup">
    <div class="taskhead">
      <div class="dots" id="mDots"></div>
      <div class="p" id="mPrompt"></div>
    </div>
    <div class="panebar" id="mPanes">
      <button id="paneHtml" aria-pressed="true">HTML</button>
      <button id="paneCss" aria-pressed="false">CSS</button>
    </div>
    <div class="surface">
      <textarea class="editor" id="mEditor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div class="previewlabel">Live preview</div>
    <div class="preview"><iframe id="mPreview" title="Live preview" sandbox="allow-same-origin"></iframe></div>
    <div class="checklist" id="mChecks"></div>
    <div id="mHintBox"></div>
  </section>
</main>

<div id="compare" style="display:none">
  <div class="cmpbar">
    <span class="eyebrow">Side by side</span>
    <select class="langsel" id="cmpSel" aria-label="Compare with"></select>
  </div>
  <div class="surface"><div id="cmpCode" class="codelines"></div></div>
</div>

<div id="playPanel" style="display:none">
  <div class="cmpbar"><span class="eyebrow">Play it</span>
    <button class="ghost" id="btnPlayRestart" style="margin-left:auto">Restart</button></div>
  <div class="playout" id="playOut"></div>
  <div class="playbar">
    <input id="playIn" type="text" autocomplete="off" autocapitalize="off" placeholder="type here, then send">
    <button class="primary" id="btnPlaySend">Send</button>
  </div>
</div>

<div class="viewnote" id="viewNote" style="display:none"></div>
<div class="tokenbar" id="tokenbar" style="display:none"></div>

<div class="controls" id="markupControls" style="display:none">
  <button class="primary" id="mCheck">Check</button>
  <button class="ghost" id="mHint">Hint</button>
  <button class="danger" id="mReveal">Show me</button>
  <button class="danger" id="mReset">Reset</button>
</div>

<div class="controls" id="buildControls" style="display:none">
  <button class="primary" id="btnRun">Run</button>
  <button class="ghost" id="btnCheck">Check</button>
  <button class="ghost" id="btnHint">Hint</button>
  <button class="danger" id="btnReveal">Show me</button>
  <button class="danger" id="btnResetTask">Reset</button>
</div>

<div class="stepbar" id="stepbar" style="display:none">
  <button class="sq" id="btnPrev" aria-label="Previous step">◀</button>
  <button class="sq" id="btnPlay" aria-label="Play steps">▶</button>
  <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Execution step">
  <button class="sq" id="btnNext" aria-label="Next step">▶|</button>
</div>
<div class="stepmeta" id="stepmeta" style="display:none"></div>

<div class="readout" id="readout">
  <div class="tabs" role="tablist">
    <button id="tabOut" role="tab" aria-selected="true">Output</button>
    <button id="tabVars" role="tab" aria-selected="false">Variables</button>
    <button id="tabNote" role="tab" aria-selected="false">Notes</button>
  </div>
  <div class="panel" id="panelOut" data-open="true"></div>
  <div class="panel" id="panelVars"></div>
  <div class="panel" id="panelNote"></div>
