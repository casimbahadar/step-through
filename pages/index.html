        const t = TYPES.varType(n, SCOPE);
        DECLARED.add(n);
        // no initialiser, so this reads back as a declaration rather than an assignment
        if (spec.declStyle === 'kotlin') {
          const objLike = typeof t === 'string' && (t.indexOf('obj:') === 0 || t === 'unknown');
          out.push(pad(depth, spec) + (objLike ? 'lateinit var ' : 'var ') + safeName(n, spec) + ': ' + typeSurface(t, spec));
        } else {
          out.push(pad(depth, spec) + typeSurface(t, spec) + ' ' + safeName(n, spec) + ';');
        }
      }
    }
  }
  if (isScopeRoot && spec.declStyle === 'kotlin') {
    for (const n of reassignedParams(body, params)) {
      out.push(pad(depth, spec) + 'var ' + safeName(n, spec) + ' = ' + safeName(n, spec));
    }
  }
  if (isScopeRoot && spec.declStyle === 'go' && TYPES) {
    emitTypedDecls(body, depth, spec, out, params);
  }
  if (spec.hoistDecls && isScopeRoot) {
    const names = collectAssigned(body, params);
    if (names.length) {
      if (spec.typed) {
        for (const n of names) {
          out.push(pad(depth, spec) + spec.declKeyword + ' ' + safeName(n, spec) + ': ' + typeSurface(TYPES.varType(n, SCOPE), spec) + ';');
        }
      } else {
        out.push(pad(depth, spec) + spec.declKeyword + ' ' + names.map(n => safeName(n, spec)).join(', ') + ';');
      }
    }
  }
  for (const s of body) emitStatement(s, depth, spec, out);
}

function emitBlock(body, depth, spec, out) {
  if (spec.blocks === 'indent') {
    for (const s of body) emitStatement(s, depth + 1, spec, out);
  } else {
    for (const s of body) emitStatement(s, depth + 1, spec, out);
  }
}

function header(text, spec) {
  if (spec.blocks === 'indent') return text + ':';
  if (spec.blocks === 'end') return text;
  return text + ' {';
}
function closeBlock(depth, spec, out) {
  if (spec.blocks === 'braces') out.push(pad(depth, spec) + '}');
  else if (spec.blocks === 'end') out.push(pad(depth, spec) + 'end');
}
function cond(e, spec) { return spec.condParens ? '(' + expr(e, spec, 0) + ')' : expr(e, spec, 0); }
function semi(spec) { return (spec.blocks === 'braces' && spec.semis !== false) ? ';' : ''; }
function tOf(node) { return TYPES ? TYPES.typeOf(node, SCOPE) : 'unknown'; }
function vname(n, spec) { return (spec.varPrefix || '') + safeName(n, spec); }

function emitStatement(s, depth, spec, out) {
  const start = out.length;
  emitStatementInner(s, depth, spec, out);
  if (LINEMAP) {
    // inner statements claim their lines first; whatever is left belongs to this one
    for (let i = start; i < out.length; i++) if (LINEMAP[i] === undefined) LINEMAP[i] = s.line || 0;
  }
}

function emitStatementInner(s, depth, spec, out) {
  const ind = pad(depth, spec);
  switch (s.kind) {
    case 'Assign': {
      if (spec.dictLiteral === 'statements' && s.value.kind === 'Dict' && s.target.kind === 'Ident') {
        const nm = vname(s.target.name, spec);
        const first = DECLARED && !DECLARED.has(s.target.name);
        if (first) DECLARED.add(s.target.name);
        const decl = first ? typeSurface(TYPES.varType(s.target.name, SCOPE), spec) + ' ' : '';
        out.push(ind + decl + nm + ' = new LinkedHashMap<>()' + semi(spec));
        for (const [k, v] of s.value.pairs) {
          out.push(ind + nm + '.put(' + expr(k, spec, 0) + ', ' + expr(v, spec, 0) + ')' + semi(spec));
        }
        return;
      }
      const lo = spec.listOps;
      // writing to a map slot needs no null assertion; only reading does
      if (s.target.kind === 'Index' && isMap(tOf(s.target.obj)) && spec.dictStyle === 'kotlin') {
        out.push(ind + expr(s.target.obj, spec, 9) + '[' + expr(s.target.idx, spec, 0) + '] = ' + expr(s.value, spec, 0) + semi(spec));
        return;
      }
      if (s.target.kind === 'Index' && isMap(tOf(s.target.obj)) && spec.dictStyle === 'javamap') {
        out.push(ind + expr(s.target.obj, spec, 9) + '.put(' + expr(s.target.idx, spec, 0) + ', ' + expr(s.value, spec, 0) + ')' + semi(spec));
        return;
      }
      if (s.target.kind === 'Index' && !isMap(tOf(s.target.obj)) && lo && lo.set === 'method') {
        out.push(ind + expr(s.target.obj, spec, 9) + '.' + lo.setName + '(' +
          expr(s.target.idx, spec, 0) + ', ' + expr(s.value, spec, 0) + ')' + semi(spec));
        return;
      }
      if ((spec.declStyle === 'kotlin' || spec.declStyle === 'prefix') && s.target.kind === 'Ident' && DECLARED && !DECLARED.has(s.target.name)) {
        DECLARED.add(s.target.name);
        const t = TYPES ? TYPES.varType(s.target.name, SCOPE) : 'unknown';
        if (spec.declStyle === 'kotlin') {
          out.push(ind + 'var ' + safeName(s.target.name, spec) + ': ' + typeSurface(t, spec) + ' = ' + expr(s.value, spec, 0));
        } else {
          EXPECT_TYPE = t;    // an empty literal has no type of its own; the declaration does
          const rhs = expr(s.value, spec, 0);
          EXPECT_TYPE = null;
          out.push(ind + typeSurface(t, spec) + ' ' + safeName(s.target.name, spec) + ' = ' + rhs + semi(spec));
        }
        return;
      }
      out.push(ind + expr(s.target, spec, 0) + ' = ' + expr(s.value, spec, 0) + semi(spec));
      return;
    }
    case 'ExprStmt': {
      const lo = spec.listOps;
      if (s.expr.kind === 'Method' && s.expr.name === 'append' && lo && lo.append === 'reassign') {
        const o = expr(s.expr.obj, spec, 0);
        out.push(ind + o + ' = append(' + o + ', ' + expr(s.expr.args[0], spec, 0) + ')' + semi(spec));
        return;
      }
      out.push(ind + expr(s.expr, spec, 0) + semi(spec));
      return;
    }
    case 'Return':
      out.push(ind + 'return' + (s.value ? ' ' + expr(s.value, spec, 0) : '') + semi(spec));
      return;
    case 'Break': out.push(ind + 'break' + semi(spec)); return;
    case 'Continue': out.push(ind + 'continue' + semi(spec)); return;
    case 'If': {
      const chained = spec.blocks === 'end';
      // Go insists on "} else {" on one line; the others read better that way too
      const cuddle = spec.blocks === 'braces';
      const more = o => !!(o && o.length);
      out.push(ind + header('if ' + cond(s.cond, spec), spec));
      emitBlock(s.body, depth, spec, out);
      let orelse = s.orelse;
      if (!chained && !(cuddle && more(orelse))) closeBlock(depth, spec, out);
      while (orelse && orelse.length === 1 && orelse[0].kind === 'If') {
        const e = orelse[0];
        const word = spec.blocks === 'indent' ? 'elif ' : (chained ? 'elsif ' : 'else if ');
        out.push(ind + (cuddle ? '} ' : '') + header(word + cond(e.cond, spec), spec));
        emitBlock(e.body, depth, spec, out);
        orelse = e.orelse;
        if (!chained && !(cuddle && more(orelse))) closeBlock(depth, spec, out);
      }
      if (more(orelse)) {
        out.push(ind + (cuddle ? '} ' : '') + header('else', spec));
        emitBlock(orelse, depth, spec, out);
        if (!chained) closeBlock(depth, spec, out);
      }
      if (chained) out.push(ind + 'end');
      return;
    }
    case 'While':
      out.push(ind + header((spec.whileWord || 'while') + ' ' + cond(s.cond, spec), spec));
      emitBlock(s.body, depth, spec, out);
      closeBlock(depth, spec, out);
      return;
    case 'ForRange': {
      let head;
      if (spec.loopStyle === 'until') {
        head = 'for (' + safeName(s.var, spec) + ' in ' + expr(s.start, spec, 0) + ' until ' + expr(s.end, spec, 0) + ')';
      } else if (spec.loopStyle === 'go') {
        head = 'for ' + safeName(s.var, spec) + ' := ' + expr(s.start, spec, 0) + '; ' + safeName(s.var, spec) + ' < ' + expr(s.end, spec, 0) + '; ' + safeName(s.var, spec) + '++';
      } else if (spec.loopStyle === 'typedfor') {
        // if the name already has a hoisted declaration in this scope, reuse it
        const v = safeName(s.var, spec);
        const decl = (DECLARED && DECLARED.has(s.var)) ? '' : 'int ';
        head = 'for (' + decl + v + ' = ' + expr(s.start, spec, 0) + '; ' + v + ' < ' + expr(s.end, spec, 0) + '; ' + v + '++)';
      } else if (spec.loopStyle === 'cstyle' && spec.varPrefix) {
        const v = vname(s.var, spec);
        head = 'for (' + v + ' = ' + expr(s.start, spec, 0) + '; ' + v + ' < ' + expr(s.end, spec, 0) + '; ' + v + '++)';
      } else if (spec.loopStyle === 'dots') {
        head = 'for ' + safeName(s.var, spec) + ' in ' + expr(s.start, spec, 0) + '...' + expr(s.end, spec, 0);
      } else if (spec.loopStyle === 'range') {
        const isZero = s.start.kind === 'Num' && s.start.v === 0;
        const args = isZero ? expr(s.end, spec, 0) : expr(s.start, spec, 0) + ', ' + expr(s.end, spec, 0);
        head = 'for ' + s.var + ' in range(' + args + ')';
      } else {
        head = 'for (' + spec.declKeyword + ' ' + s.var + ' = ' + expr(s.start, spec, 0) +
          '; ' + s.var + ' < ' + expr(s.end, spec, 0) + '; ' + s.var + '++)';
      }
      out.push(ind + header(head, spec));
      emitBlock(s.body, depth, spec, out);
      closeBlock(depth, spec, out);
      return;
    }
    case 'ForEach': {
      let head;
      if (tOf(s.iter) === 'string' && spec.charsOf) {
        const src2 = spec.charsOf.style === 'method'
          ? expr(s.iter, spec, 9) + '.' + spec.charsOf.name
          : spec.charsOf.name + '(' + expr(s.iter, spec, 0) + ')';
        const head2 = spec.id === 'php'
          ? 'foreach (' + src2 + ' as ' + vname(s.var, spec) + ')'
          : 'for ' + safeName(s.var, spec) + ' in ' + src2;
        out.push(ind + header(head2, spec));
        emitBlock(s.body, depth, spec, out);
        closeBlock(depth, spec, out);
        return;
      }
      if (isMap(tOf(s.iter))) {
        const d = expr(s.iter, spec, 9), v2 = safeName(s.var, spec);
        if (spec.id === 'python') head = 'for ' + v2 + ' in ' + d;
        else if (spec.id === 'ruby') head = 'for ' + v2 + ' in ' + d + '.keys';
        else if (spec.dictStyle === 'javamap') head = 'for (' + typeSurface(mapKey(tOf(s.iter)), spec) + ' ' + v2 + ' : ' + d + '.keySet())';
        else if (spec.dictStyle === 'kotlin') head = 'for (' + v2 + ' in ' + d + '.keys)';
        else if (spec.dictStyle === 'csharp') head = 'foreach (' + typeSurface(mapKey(tOf(s.iter)), spec) + ' ' + v2 + ' in ' + d + '.Keys)';
        else if (spec.dictStyle === 'php') head = 'foreach (array_keys(' + d + ') as ' + vname(s.var, spec) + ')';
        else head = 'for (' + spec.declKeyword + ' ' + v2 + ' of Object.keys(' + d + '))';
        out.push(ind + header(head, spec));
        emitBlock(s.body, depth, spec, out);
        closeBlock(depth, spec, out);
        return;
      }
      if (spec.loopStyle === 'go') head = 'for _, ' + safeName(s.var, spec) + ' := range ' + expr(s.iter, spec, 0);
      else if (spec.id === 'java') head = 'for (' + typeSurface(tOf(s.iter) === 'string' ? 'string' : elemOf(tOf(s.iter)), spec) + ' ' + safeName(s.var, spec) + ' : ' + expr(s.iter, spec, 0) + ')';
      else if (spec.id === 'csharp') head = 'foreach (' + typeSurface(tOf(s.iter) === 'string' ? 'string' : elemOf(tOf(s.iter)), spec) + ' ' + safeName(s.var, spec) + ' in ' + expr(s.iter, spec, 0) + ')';
      else if (spec.id === 'kotlin') head = 'for (' + safeName(s.var, spec) + ' in ' + expr(s.iter, spec, 0) + ')';
      else if (spec.id === 'php') head = 'foreach (' + expr(s.iter, spec, 0) + ' as ' + vname(s.var, spec) + ')';
      else if (spec.loopStyle === 'range' || spec.loopStyle === 'dots') head = 'for ' + s.var + ' in ' + expr(s.iter, spec, 0);
      else head = 'for (' + spec.declKeyword + ' ' + s.var + ' of ' + expr(s.iter, spec, 0) + ')';
      out.push(ind + header(head, spec));
      emitBlock(s.body, depth, spec, out);
      closeBlock(depth, spec, out);
      return;
    }
    case 'Try': {
      const er = spec.errors;
      if (!er) throw new LangError(spec.name + ' has no exceptions', s.line || 0,
        spec.id === 'go' ? 'Go returns errors as ordinary values instead, which is a different lesson.' : '');
      if (er.style === 'ruby') {
        out.push(ind + 'begin');
        emitBlock(s.body, depth, spec, out);
        out.push(ind + 'rescue => err');
        emitBlock(s.handler, depth, spec, out);
        out.push(ind + 'end');
      } else if (er.style === 'python') {
        out.push(ind + 'try:');
        emitBlock(s.body, depth, spec, out);
        out.push(ind + 'except Exception as err:');
        emitBlock(s.handler, depth, spec, out);
      } else {
        out.push(ind + 'try {');
        emitBlock(s.body, depth, spec, out);
        const decl = er.style === 'typed'
          ? '} catch (' + er.errType + ' ' + (spec.varPrefix || '') + 'err) {'
          : '} catch (err' + (er.catchAnnot || '') + ') {';
        out.push(ind + decl);
        emitBlock(s.handler, depth, spec, out);
        out.push(ind + '}');
      }
      return;
    }
    case 'Throw': {
      const er = spec.errors;
      if (!er) throw new LangError(spec.name + ' has no exceptions', s.line || 0, '');
      const m = expr(s.msg, spec, 0);
      const body = er.throwWrap === 'bare' ? m : er.throwWrap + '(' + m + ')';
      out.push(ind + (er.style === 'python' || er.style === 'ruby' ? 'raise ' : 'throw ') + body + semi(spec));
      return;
    }
    case 'Class': emitClass(s, depth, spec, out); return;
    case 'Func': {
      let head;
      const fname = safeName(s.name, spec);
      const sp = pn => safeName(pn, spec);
      if (spec.typed && spec.declStyle === 'prefix') {
        const f = TYPES.funcs.get(s.name);
        const ps = s.params.map((pn, i) => typeSurface(f ? f.params[i] : 'unknown', spec) + ' ' + sp(pn)).join(', ');
        head = 'static ' + typeSurface(f ? f.ret : 'void', spec) + ' ' + fname + '(' + ps + ')';
      } else if (spec.typed && spec.declStyle === 'kotlin') {
        const f = TYPES.funcs.get(s.name);
        const ps = s.params.map((pn, i) => sp(pn) + ': ' + typeSurface(f ? f.params[i] : 'unknown', spec)).join(', ');
        const ret = f && f.ret !== 'void' ? ': ' + typeSurface(f.ret, spec) : '';
        head = 'fun ' + fname + '(' + ps + ')' + ret;
      } else if (spec.typed && spec.declStyle === 'go') {
        const f = TYPES.funcs.get(s.name);
        const ps = s.params.map((pn, i) => sp(pn) + ' ' + typeSurface(f ? f.params[i] : 'unknown', spec)).join(', ');
        const ret = f && f.ret !== 'void' ? ' ' + typeSurface(f.ret, spec) : '';
        head = 'func ' + fname + '(' + ps + ')' + ret;
      } else if (spec.varPrefix) {
        head = spec.funcKeyword + ' ' + fname + '(' + s.params.map(pn => vname(pn, spec)).join(', ') + ')';
      } else if (spec.typed) {
        const f = TYPES.funcs.get(s.name);
        const ps = s.params.map((pn, i) => sp(pn) + ': ' + typeSurface(f ? f.params[i] : 'unknown', spec)).join(', ');
        head = spec.funcKeyword + ' ' + fname + '(' + ps + '): ' + typeSurface(f ? f.ret : 'void', spec);
      } else {
        head = spec.funcKeyword + ' ' + fname + '(' + s.params.map(sp).join(', ') + ')';
      }
      out.push(ind + header(head, spec));
      const outerScope = SCOPE;
      SCOPE = s.name;
      const inner = [];
      const savedDecl = DECLARED;
      emitBody(s.body, depth + 1, spec, inner, true, s.params);
      DECLARED = savedDecl;
      SCOPE = outerScope;
      for (const l of inner) out.push(l);
      closeBlock(depth, spec, out);
      return;
    }
    default:
      throw new LangError('Cannot print node kind ' + s.kind, s.line || 0, '');
  }
}

function classFieldNames(node) {
  const names = [];
  const seen = new Set();
  const scan = (body) => {
    for (const st of body || []) {
      if (st.kind === 'Assign' && st.target.kind === 'Attr' && st.target.obj.kind === 'Self' && !seen.has(st.target.name)) {
        seen.add(st.target.name); names.push(st.target.name);
      }
      if (st.body) scan(st.body);
      if (st.orelse) scan(st.orelse);
    }
  };
  if (node.ctor) scan(node.ctor.body);
  for (const m of node.methods) scan(m.body);
  return names;
}

function emitKotlinClass(s, depth, spec, out) {
  const ind = pad(depth, spec);
  const inner = depth + 1;
  const info = TYPES ? TYPES.classes.get(s.name) : null;
  const fields = classFieldNames(s);
  const isParent = CLASS_NODES && [...CLASS_NODES.values()].some(c => c.parent === s.name);

  // the nearest constructor above, since Kotlin does not inherit constructors either
  let up = s.parent && CLASS_NODES ? CLASS_NODES.get(s.parent) : null;
  while (up && !up.ctor) up = up.parent ? CLASS_NODES.get(up.parent) : null;

  const ctorParams = s.ctor ? s.ctor.params : (up ? up.ctor.params : []);
  const ctorInfo = s.ctor ? info : (up && TYPES ? TYPES.classes.get(up.name) : null);
  const paramList = ctorParams.map((pn, i) =>
    safeName(pn, spec) + ': ' + typeSurface(ctorInfo ? ctorInfo.ctorParams[i] : 'unknown', spec)).join(', ');

  let body = s.ctor ? s.ctor.body : [];
  let baseArgs = null;
  if (body.length && body[0].kind === 'ExprStmt' && body[0].expr.kind === 'SuperInit') {
    baseArgs = body[0].expr.args.map(a => expr(a, spec, 0)).join(', ');
    body = body.slice(1);
  } else if (!s.ctor && up) {
    baseArgs = up.ctor.params.map(pn => safeName(pn, spec)).join(', ');
  }

  let head = (isParent ? 'open ' : '') + 'class ' + safeName(s.name, spec);
  if (ctorParams.length) head += '(' + paramList + ')';
  if (s.parent) head += ' : ' + safeName(s.parent, spec) + '(' + (baseArgs || '') + ')';
  out.push(ind + head + ' {');

  const outerScope = SCOPE;
  for (const f of fields) {
    out.push(pad(inner, spec) + 'var ' + safeName(f, spec) + ': ' +
      typeSurface(info.fields.get(f), spec) + ' = ' + defaultValue(info.fields.get(f), spec));
  }
  if (body.length) {
    SCOPE = 'class:' + s.name + ':new';
    DECLARED = new Set(ctorParams);
    out.push(pad(inner, spec) + 'init {');
    for (const st of body) emitStatement(st, inner + 1, spec, out);
    out.push(pad(inner, spec) + '}');
    SCOPE = outerScope;
  }
  for (const m of s.methods) {
    SCOPE = 'class:' + s.name + ':' + m.name;
    const sig = info ? info.methods.get(m.name) : null;
    let mod = '';
    if (TYPES.overrides(s.name, m.name)) mod = 'override ';
    else if (TYPES.overridden(s.name, m.name)) mod = 'open ';
    const ps = m.params.map((pn, i) => safeName(pn, spec) + ': ' + typeSurface(sig.params[i], spec)).join(', ');
    const ret = sig && sig.ret !== 'void' ? ': ' + typeSurface(sig.ret, spec) : '';
    out.push(pad(inner, spec) + mod + 'fun ' + safeName(m.name, spec) + '(' + ps + ')' + ret + ' {');
    DECLARED = new Set(m.params);
    for (const st of m.body) emitStatement(st, inner + 1, spec, out);
    out.push(pad(inner, spec) + '}');
    SCOPE = outerScope;
  }
  out.push(ind + '}');
}

function emitClass(s, depth, spec, out) {
  if (spec.kotlinClass) return emitKotlinClass(s, depth, spec, out);
  if (!spec.classes) {
    throw new LangError(spec.name + ' has no classes or inheritance', s.line || 0,
      spec.id === 'go' ? 'Go leaves inheritance out on purpose. Read this lesson in another language.' : '');
  }
  const ind = pad(depth, spec);
  const cname = safeName(s.name, spec);
  const pname = s.parent ? safeName(s.parent, spec) : null;
  let head = 'class ' + cname;
  if (pname) {
    if (spec.parentStyle === 'parens') head += '(' + pname + ')';
    else if (spec.parentStyle === 'lt') head += ' < ' + pname;
    else if (spec.parentStyle === 'colon') head += ' : ' + pname;
    else head += ' extends ' + pname;
  }
  out.push(ind + header(head, spec));
  const inner = depth + 1;
  const fields = classFieldNames(s);

  if (spec.attrReader && fields.length) out.push(pad(inner, spec) + 'attr_reader ' + fields.map(f => ':' + f).join(', '));
  if (spec.typed && spec.declStyle === 'prefix' && TYPES) {
    const info = TYPES.classes.get(s.name);
    for (const f of fields) out.push(pad(inner, spec) + (spec.fieldModifier || '') + typeSurface(info.fields.get(f), spec) + ' ' + safeName(f, spec) + ';');
  } else if (spec.typed && spec.annot && TYPES) {
    const info = TYPES.classes.get(s.name);
    for (const f of fields) out.push(pad(inner, spec) + safeName(f, spec) + ': ' + typeSurface(info.fields.get(f), spec) + ';');
  } else if (spec.fieldModifier && spec.varPrefix) {
    for (const f of fields) out.push(pad(inner, spec) + spec.fieldModifier + spec.varPrefix + safeName(f, spec) + ';');
  }

  const outerScope = SCOPE;
  const info = TYPES ? TYPES.classes.get(s.name) : null;

  // the nearest constructor above this class, if any
  const inheritedCtor = (() => {
    let node = s.parent && CLASS_NODES ? CLASS_NODES.get(s.parent) : null;
    while (node) { if (node.ctor) return node; node = node.parent ? CLASS_NODES.get(node.parent) : null; }
    return null;
  })();

  // Java and C# do not inherit constructors: a child with none needs one that forwards
  if (!s.ctor && inheritedCtor && spec.needsForwardingCtor) {
    const pinfo = TYPES ? TYPES.classes.get(inheritedCtor.name) : null;
    const ps = inheritedCtor.ctor.params.map((pn, i) =>
      typeSurface(pinfo ? pinfo.ctorParams[i] : 'unknown', spec) + ' ' + safeName(pn, spec)).join(', ');
    const call = inheritedCtor.ctor.params.map(pn => safeName(pn, spec)).join(', ');
    if (spec.baseInHeader) {
      out.push(pad(inner, spec) + header((spec.memberModifier || '') + cname + '(' + ps + ') : base(' + call + ')', spec));
      out.push(pad(inner, spec) + '}');
    } else {
      out.push(pad(inner, spec) + header((spec.memberModifier || '') + cname + '(' + ps + ')', spec));
      out.push(pad(inner + 1, spec) + 'super(' + call + ');');

  if (s.ctor) {

        body = body.slice(1);

    } else if (spec.varPrefix) {
      headText = 'function ' + spec.ctorName + '(' + s.ctor.params.map(pn => vname(pn, spec)).join(', ') + ')';
    } else if (spec.typed && spec.annot) {
      headText = spec.ctorName + '(' + s.ctor.params.map((pn, i) => pn + ': ' + typeSurface(info.ctorParams[i], spec)).join(', ') + ')';
    } else if (spec.methodKeyword) {
      const ps = (spec.explicitSelfParam ? ['self'] : []).concat(s.ctor.params);

    } else {
      headText = spec.ctorName + '(' + s.ctor.params.join(', ') + ')';

    // does have one and the author skipped it, the program is genuinely broken in this
    // language too, so leave it broken rather than papering over the bug.
    if (spec.needsExplicitSuper && s.parent && !callsSuper && !inheritedCtor) {

    for (const st of body) emitStatement(st, inner + 1, spec, out);
    if (spec.blocks === 'braces') out.push(pad(inner, spec) + '}');

  }

  for (const m of s.methods) {

    let headText;
    if (spec.declStyle === 'prefix' && spec.typed) {
      const ps = m.params.map((pn, i) => typeSurface(sig.params[i], spec) + ' ' + safeName(pn, spec)).join(', ');

      headText = (spec.memberModifier || '') + virt + typeSurface(sig.ret, spec) + ' ' + safeName(m.name, spec) + '(' + ps + ')';
    } else if (spec.typed && spec.annot) {
      const ps = m.params.map((pn, i) => pn + ': ' + typeSurface(sig.params[i], spec)).join(', ');
      headText = m.name + '(' + ps + '): ' + typeSurface(sig.ret, spec);
    } else if (spec.varPrefix) {
      headText = 'function ' + safeName(m.name, spec) + '(' + m.params.map(pn => vname(pn, spec)).join(', ') + ')';
    } else if (spec.methodKeyword) {
      const ps = (spec.explicitSelfParam ? ['self'] : []).concat(m.params);
      headText = 'def ' + m.name + '(' + ps.join(', ') + ')';
    } else {
      headText = m.name + '(' + m.params.join(', ') + ')';
    }
    DECLARED = new Set(m.params);
    out.push(pad(inner, spec) + header(headText, spec));
    for (const st of m.body) emitStatement(st, inner + 1, spec, out);
    if (spec.blocks === 'braces') out.push(pad(inner, spec) + '}');
    else if (spec.blocks === 'end') out.push(pad(inner, spec) + 'end');
    SCOPE = outerScope;
  }
  closeBlock(depth, spec, out);
}

function surfaceWord(canon, spec) {

/* ---------- 6. EVALUATOR (trace-recording) ---------- */

function fmt(v, langId) {
  const spec = SPECS[langId] || JAVASCRIPT;
  if (v instanceof Map) return '{' + [...v.entries()].map(([k, x]) => fmtInner(k, langId) + ': ' + fmtInner(x, langId)).join(', ') + '}';
  if (v && typeof v === 'object' && v.__obj) return 'a ' + v.cls;
  if (v === null || v === undefined) return spec.literals.null;
  if (typeof v === 'boolean') return v ? spec.literals.true : spec.literals.false;
  if (typeof v === 'number') {
    if (Number.isInteger(v)) return String(v);
    return String(Math.round(v * 1e10) / 1e10);
  }
  if (Array.isArray(v)) return '[' + v.map(x => fmtInner(x, langId)).join(', ') + ']';
  return String(v);
}
function fmtInner(v, langId) {
  if (typeof v === 'string') return '"' + v + '"';
  return fmt(v, langId);
}

class ReturnSignal { constructor(v) { this.v = v; } }
class BreakSignal { }
class ContinueSignal { }

function run(ast, options = {}) {
  const lang = options.lang || 'python';
  const maxSteps = options.maxSteps || 200000;
  const maxTrace = options.maxTrace || 4000;

  const output = [];
  const trace = [];
  const inputQueue = (options.inputs || []).slice();
  const funcs = new Map();
  const classes = new Map();
  let steps = 0;
  let error = null;

  const globalFrame = { name: 'main', vars: new Map(), self: null, defining: null };
  const stack = [globalFrame];

  const copyVal = (v) => v instanceof Map ? new Map(v) : (Array.isArray(v) ? v.slice() : v);
  const snapshotVars = (frame) => {
    const o = {};
    for (const [k, v] of frame.vars) o[k] = copyVal(v);
    if (frame.self) for (const [k, v] of frame.self.fields) o['self.' + k] = copyVal(v);
    return o;
  };

  const record = (node, note) => {
    steps++;
    if (steps > maxSteps) {
      const tooLong = new LangError('This program ran too long and was stopped', node.line || 0,
        'It probably has a loop that never ends. Check the loop condition.');
      tooLong.fatal = true;
      throw tooLong;
    }
    if (trace.length < maxTrace) {
      trace.push({
        line: node.line || 0,
        note: note || '',
        depth: stack.length,
        frame: stack[stack.length - 1].name,
        vars: snapshotVars(stack[stack.length - 1]),
        globals: stack.length > 1 ? snapshotVars(globalFrame) : null,
        outputLen: output.length

    }
  };

  const lookup = (name, line) => {
    const top = stack[stack.length - 1];
    if (top.vars.has(name)) return top.vars.get(name);
    if (globalFrame.vars.has(name)) return globalFrame.vars.get(name);
    throw new LangError('"' + name + '" has no value yet (line ' + line + ')', line,
      'Give it a value before using it, and check the spelling.');
  };

  const setVar = (name, value) => { stack[stack.length - 1].vars.set(name, value); };

  const truthy = (v, line) => {
    if (typeof v === 'boolean') return v;
    if (typeof v === 'number') return v !== 0;
    if (typeof v === 'string') return v.length > 0;
    if (Array.isArray(v)) return v.length > 0;
    return false;
  };

  const isObj = (v) => !!(v && typeof v === 'object' && v.__obj);
  const classOf = (name, line) => {
    const c = classes.get(name);
    if (!c) throw new LangError('There is no class called "' + name + '" (line ' + line + ')', line,
      'Define the class before creating one, and check the spelling.');
    return c;
  };

    let c = classes.get(clsName);
    while (c) {
      if (c.methods.has(method)) return { m: c.methods.get(method), owner: c };
      c = c.parent ? classes.get(c.parent) : null;
    }

  };

    let c = classes.get(clsName);
    while (c) { if (c.ctor) return { ctor: c.ctor, owner: c }; c = c.parent ? classes.get(c.parent) : null; }
    return null;

        if (s.kind === 'Class') {

    execBlock(ast.body);

    if (trace.length < maxTrace) {
      const lastStmt = ast.body.length ? ast.body[ast.body.length - 1] : null;
      trace.push({
        line: (trace.length ? trace[trace.length - 1].line : (lastStmt && lastStmt.line) || 0),
        note: 'done', depth: 1, frame: 'main',

    if (err instanceof ReturnSignal) error = new LangError('"return" used outside a function', 0, '');
    else if (err instanceof BreakSignal || err instanceof ContinueSignal) error = new LangError('"break"/"continue" used outside a loop', 0, '');

    else throw err;
  }

  for (let i = 1; i < r.trace.length; i++) {
    const t = r.trace[i];
    for (const k of Object.keys(t.vars)) {
      if (t.vars[k] === null || Array.isArray(t.vars[k])) continue;
      usable.push({ step: i, name: k, value: t.vars[k], line: t.line });
    }
  }
  if (!usable.length) return null;

  const pick = usable[Math.floor(rnd() * usable.length)];
  const correct = displayValue(pick.value, lang, fmt);

  const others = [];
  for (const u of r.trace) {
    if (u.vars[pick.name] !== undefined && !Array.isArray(u.vars[pick.name]) && u.vars[pick.name] !== null) {
      others.push(displayValue(u.vars[pick.name], lang, fmt));
    }
  }
  if (typeof pick.value === 'number') {
    others.push(fmt(pick.value + 1, lang), fmt(pick.value - 1, lang), fmt(pick.value * 2, lang));
  }
  if (typeof pick.value === 'string') {
    others.push('""', '"' + pick.value + pick.value + '"');
  }
  const distract = uniqueStrings(shuffled(others, rnd), correct).slice(0, 3);
  if (distract.length < 2) return null;

  return {
    type: 'value',
    prompt: 'The program is paused just before line ' + pick.line + ' runs. What is ' + pick.name + ' right now?',
    code: src, lang, focusLine: pick.line, stepIndex: pick.step,
    correct, distract, meta: { name: pick.name, step: pick.step },
    explain: 'This is step ' + (pick.step + 1) + ' of ' + r.trace.length + '. Step to it yourself to check.'
  };
}

function qNextLine(src, lang, r, rnd) {
  const spots = [];
  for (let i = 0; i < r.trace.length - 1; i++) {
    if (r.trace[i + 1].line !== r.trace[i].line) spots.push(i);
  }
  if (!spots.length) return null;
  const i = spots[Math.floor(rnd() * spots.length)];
  const from = r.trace[i].line, to = r.trace[i + 1].line;

  const lineCount = src.split('\n').length;
  const all = [];
  for (let n = 1; n <= lineCount; n++) if (n !== to && n !== from) all.push(String(n));
  const distract = uniqueStrings(shuffled(all, rnd), String(to)).slice(0, 3);
  if (distract.length < 2) return null;

  return {
    type: 'nextline',
    prompt: 'Line ' + from + ' has just finished. Which line runs next?',
    code: src, lang, focusLine: from, stepIndex: i,
    correct: String(to), distract, meta: { step: i },
    explain: 'Programs do not always run from top to bottom. Loops jump back, and ifs skip ahead.'
  };
}

/* ---------- public: build a set of questions for a program ---------- */

function makeQuestions(src, lang, seed, count, engine) {
  const rnd = mulberry32(seed || 1);
  let r;
  try {
    r = engine.execute(src, lang, { maxSteps: 50000, maxTrace: 600 });
    if (r.error) return [];
  } catch (e) { return []; }

  const builders = shuffled([qOutput, qValue, qNextLine], rnd);
  const built = [];
  for (let pass = 0; pass < 3 && built.length < (count || 3); pass++) {
    for (const b of builders) {
      if (built.length >= (count || 3)) break;
      const q = b.length === 5
        ? b(src, lang, r, rnd, engine.fmt)
        : b(src, lang, r, rnd);
      if (!q) continue;
      if (built.some(x => x.type === q.type && x.prompt === q.prompt)) continue;
      const options = shuffled([q.correct].concat(q.distract), rnd);
      built.push({
        type: q.type, prompt: q.prompt, code: q.code, lang: q.lang,
        focusLine: q.focusLine, stepIndex: q.stepIndex, meta: q.meta || {},
        options, answer: options.indexOf(q.correct), explain: q.explain
      });
    }
  }
  return built;
}

/* ============================================================
   CRAFT CHECKS: best practice, judged on the parsed program
   rather than on the text, so formatting never fools them.
   ============================================================ */

function walkAst(node, visit) {
  if (Array.isArray(node)) { node.forEach(n => walkAst(n, visit)); return; }
  if (!node || typeof node !== 'object') return;
  if (node.kind) visit(node);
  for (const v of Object.values(node)) {
    if (v && typeof v === 'object') walkAst(v, visit);
  }
}

const CRAFT = {
  usesLoop: {
    label: 'Used a loop instead of repeating yourself',
    test: (ast) => { let f = false; walkAst(ast, n => { if (['ForRange', 'ForEach', 'While'].includes(n.kind)) f = true; }); return f; }
  },
  usesFunction: {
    label: 'Packaged the work in a function',
    test: (ast) => { let f = false; walkAst(ast, n => { if (n.kind === 'Func') f = true; }); return f; }
  },
  usesVariable: {
    label: 'Stored the value in a variable',
    test: (ast) => { let f = false; walkAst(ast, n => { if (n.kind === 'Assign') f = true; }); return f; }
  },
  descriptiveNames: {
    label: 'Named things so a stranger could read it',
    test: (ast) => {
      const names = [];
      walkAst(ast, n => {
        if (n.kind === 'Assign' && n.target && n.target.kind === 'Ident') names.push(n.target.name);
        if (n.kind === 'Func') names.push(n.name);
      });
      if (!names.length) return false;
      return names.every(n => n.length >= 3);
    }
  },
  fewPrints: {
    label: 'Let the loop do the printing',
    test: (ast) => {
      let c = 0;
      walkAst(ast, n => { if (n.kind === 'Call' && n.name === 'print') c++; });
      return c <= 2;
    }
  }
};

function checkCraft(name, ast) {
  const c = CRAFT[name];
  if (!c) return null;
  try { return { name, label: c.label, pass: !!c.test(ast) }; }
  catch (e) { return { name, label: c.label, pass: false }; }
}

/* ============================================================
   SCAFFOLDS
   A task's starting point is described once, language-neutrally:
   a note in the right comment style, plus optional code that gets
   translated. Adding a language costs nothing here.
   ============================================================ */
function starterFor(task, lang, engine) {
  if (task.override && task.override[lang]) return task.override[lang];
  const spec = engine.SPECS[lang];
  const marker = spec ? spec.comment : '#';
  const lines = [];
  if (task.scaffold && task.scaffold.note) lines.push(marker + ' ' + task.scaffold.note);
  if (task.scaffold && task.scaffold.code) {
    lines.push(lang === 'python' ? task.scaffold.code : engine.translate(task.scaffold.code, 'python', lang));
  } else lines.push('');
  return lines.join('\n');
}

function solutionFor(task, lang, engine) {
  if (!task.solution) return null;
  return lang === 'python' ? task.solution : engine.translate(task.solution, 'python', lang);
}

/* ============================================================
   MEASURED GROWTH
   The interpreter counts every step it takes, so instead of claiming
   a solution is too slow we can run it at two sizes and measure how
   its cost actually grows. Nothing here is a guess.
   ============================================================ */
function measureGrowth(src, lang, speed, engine) {
  const sizes = speed.sizes || [60, 120];
  const counts = [];
  let userAst;
  try { userAst = engine.parse(src, lang); }
  catch (e) { return { ok: false, reason: 'That program does not parse yet.' }; }

  for (const n of sizes) {
    let harness;
    const filled = speed.setup.replace(/\bN\b/g, String(n)).replace(/\bK\b/g, String(Math.floor(n / 2)));
    try { harness = engine.parse(filled, 'python'); }
    catch (e) { return { ok: false, reason: 'The speed harness is broken.' }; }
    const combined = { kind: 'Program', body: userAst.body.concat(harness.body) };
    let r;
    try { r = engine.run(combined, { lang, maxSteps: 4000000, maxTrace: 1 }); }
    catch (e) { return { ok: false, reason: 'It could not be run at size ' + n + '.' }; }
    if (r.error) return { ok: false, reason: 'At size ' + n + ' it stopped: ' + r.error.message };
    counts.push(r.steps);
  }

  // Building the input costs steps of its own. For a fast solution that cost can
  // swamp the measurement, so subtract what an empty answer would have taken.
  let net = counts;
  if (speed.baseline) {
    const base = [];
    for (const n of sizes) {
      let stubAst, harness;
      try {
        stubAst = engine.parse(speed.baseline, 'python');
        harness = engine.parse(speed.setup.replace(/\bN\b/g, String(n)).replace(/\bK\b/g, String(Math.floor(n / 2))), 'python');
      } catch (e) { return { ok: false, reason: 'The speed harness is broken.' }; }
      const r = engine.run({ kind: 'Program', body: stubAst.body.concat(harness.body) },
        { lang: 'python', maxSteps: 4000000, maxTrace: 1 });
      if (r.error) return { ok: false, reason: 'The baseline could not be measured.' };
      base.push(r.steps);
    }
    net = counts.map((c, i) => Math.max(1, c - base[i]));
  }

  const growth = Math.log(net[1] / net[0]) / Math.log(sizes[1] / sizes[0]);
  const shown = Math.round(growth * 100) / 100;
  const bands = { logarithmic: [-0.5, 0.55], linear: [0.55, 1.45], quadratic: [1.45, 2.6] };
  const band = bands[speed.target] || bands.linear;
  const pass = growth >= band[0] && growth < band[1];
  return {
    ok: true, pass, growth: shown, counts: net, sizes,
    label: 'measured growth about n^' + shown.toFixed(2),
    verdict: pass
      ? 'That is ' + speed.target + ', which is the target.'
      : 'The target is ' + speed.target + '. This is closer to n^' + shown.toFixed(2) + ', so it will not scale.'
  };
}

/* A round of "which technique is this", with every pattern always on offer
   so the answer has to come from the statement rather than from elimination. */
function makeRecognitionRound(bank, names, seed, count) {
  const rnd = mulberry32(seed || 1);
  const picked = [];
  const used = {};
  const keys = Object.keys(names);
  for (let guard = 0; guard < 200 && picked.length < (count || 5); guard++) {
    const i = Math.floor(rnd() * bank.length);
    if (used[i]) continue;
    used[i] = 1;
    const item = bank[i];
    const options = shuffled(keys.map(k => names[k]), rnd);
    picked.push({
      type: 'recognise',
      prompt: item.text,
      code: '', lang: null, focusLine: 0, stepIndex: null, meta: { pattern: item.pattern },
      options,
      answer: options.indexOf(names[item.pattern]),
      explain: item.why
    });
  }
  return picked;
}

const GAME = { makeQuestions, checkCraft, CRAFT, mulberry32, starterFor, solutionFor, displayValue, measureGrowth, makeRecognitionRound };
/* GAME-END */
</script>

           ruby: 'raise "age cannot be negative" stops the current work immediately and hands that message to whoever is willing to catch it. Use it when a value makes no sense to continue with.' } },
    { h: 'What even counts as a failure varies',

  ],
  demo: { code: 'def price_of(item):\n    prices = {"coffee": 3}\n    if item in prices:\n        return prices[item]\n    raise Exception("no price for " + item)\n\ntry:\n    print(price_of("matcha"))\nexcept Exception as err:\n    print("could not find it")\n    print(err)\nprint("still running")',

  practice: { h: 'Catch what you can actually handle',

              'The block that runs instead prints the two words asked for.',
              'The last line stays outside both blocks so it always runs.'],
      solution: 'def take(item):\n    raise Exception("we are out of " + item)\n\ntry:\n    take("sugar")\nexcept Exception as err:\n    print("not found")\nprint("done")' },

    { id: 'err-2', prompt: 'Raise a failure carrying the message out of stock, catch it, print that message, then print after.',
      scaffold: { note: 'Raise it, catch it, print what it said' },

              'The caught error can be printed directly and shows the message it was given.',
              'The last line sits outside both blocks so it still runs.'],

    { id: 'err-3', prompt: 'Write a function that refuses a negative age by raising an error with the message age cannot be negative. Call it with -5, catch the failure, and print the message.',
      scaffold: { note: 'Raise inside the function, catch outside it' },

{
  id: 'fizzbuzz',
  level: 'Advanced',
  title: 'Putting it together',
  idea: 'A loop, a chain of conditions, and the order they are tested in.',
  teach: [
    { h: 'The remainder',
      p: 'The % symbol gives what is left over after dividing. 17 % 5 is 2. When the remainder is 0, the division was exact, so i % 3 == 0 is how you ask "does 3 divide into this evenly?"' },
    { h: 'Order decides the answer',
      p: 'A number divisible by 15 is also divisible by 3 and by 5. Whichever test comes first wins, so the most specific case has to be checked before the looser ones or it can never happen.' },
    { h: 'The classic',
      p: 'FizzBuzz is the traditional first real programming problem: count upward, but say Fizz for multiples of three, Buzz for multiples of five, and FizzBuzz for multiples of both.' }
  ],
  demo: { code: 'print(17 % 5)\nprint(15 % 3)\nprint(15 % 5)',
          caption: 'Three remainders. Two of them are zero, which is the signal to look for.' },
  practice: { h: 'Test the combined case first',
    p: 'When conditions overlap, sort them from narrowest to widest. This is the same rule as the grade exercise, and it will keep appearing for the rest of your programming life.' },
  tasks: [
    { id: 'fb-1', prompt: 'Print every number from 1 to 20 that divides evenly by 3, and nothing else.',
      scaffold: { note: 'Loop over the numbers, print only some of them' },
      expect: ['3', '6', '9', '12', '15', '18'],
      hints: ['Loop from 1 up to and including 20.',
              'Inside the loop, ask whether the remainder after dividing by 3 is zero.',
              'No else is needed. When the condition is false, nothing should happen.'],
      craft: 'usesLoop',
      solution: 'for i in range(1, 21):\n    if i % 3 == 0:\n        print(i)' },

    { id: 'fb-2', prompt: 'FizzBuzz from 1 to 15. Fizz for multiples of 3, Buzz for multiples of 5, FizzBuzz for both, otherwise the number itself.',
      scaffold: { note: 'Order your conditions carefully' },
      expect: ['1', '2', 'Fizz', '4', 'Buzz', 'Fizz', '7', '8', 'Fizz', 'Buzz', '11', 'Fizz', '13', '14', 'FizzBuzz'],
      hints: ['One loop, and inside it a chain of four possibilities.',
              'Check divisibility by 15 first, or it will never be reached.',
              'The final case is the plain number, so it belongs in the else.'],
      craft: 'usesLoop',
      solution: 'for i in range(1, 16):\n    if i % 15 == 0:\n        print("FizzBuzz")\n    elif i % 3 == 0:\n        print("Fizz")\n    elif i % 5 == 0:\n        print("Buzz")\n    else:\n        print(i)' }
  ]
},

{

      p: 'A base case that answers outright without calling anything, and a recursive case that does one step and calls itself on what is left. Leave out the base case and it never stops.' },

    { h: 'Each call keeps its own names',

          caption: 'Step in and watch i climb, then watch the answers come back out in reverse.' },

/* ============================================================
   MARKUP TRACK: HTML and CSS
   These are not programming languages: nothing executes, nothing
   steps. So they get their own mode, and correctness is judged by
   rendering the page and asking the browser what it actually did.
   ============================================================ */

function runMarkupChecks(doc, win, checks) {
  const results = [];
  const all = sel => Array.from(doc.querySelectorAll(sel));
  const one = sel => doc.querySelector(sel);
  const norm = s => (s || '').replace(/\s+/g, ' ').trim();

  for (const c of checks) {
    let ok = false, msg = c.msg || '';
    try {
      if (c.kind === 'exists') {
        ok = !!one(c.sel);
        if (!ok) msg = 'Nothing on the page matches ' + c.sel + ' yet.';
      } else if (c.kind === 'count') {
        const n = all(c.sel).length;
        ok = c.exact != null ? n === c.exact : n >= (c.min || 1);
        if (!ok) msg = 'Found ' + n + ' of ' + c.sel + ', expected ' + (c.exact != null ? c.exact : 'at least ' + c.min) + '.';
      } else if (c.kind === 'text') {
        const el = one(c.sel);
        if (!el) { ok = false; msg = 'There is no ' + c.sel + ' to read yet.'; }
        else {
          const t = norm(el.textContent);
          ok = c.equals != null ? t === c.equals : t.toLowerCase().indexOf(String(c.contains).toLowerCase()) >= 0;
          if (!ok) msg = c.sel + ' says "' + t + '"' + (c.equals != null ? ', expected "' + c.equals + '".' : ', which does not mention "' + c.contains + '".');
        }
      } else if (c.kind === 'attr') {
        const el = one(c.sel);
        if (!el) { ok = false; msg = 'There is no ' + c.sel + ' yet.'; }
        else {
          const v = el.getAttribute(c.name);
          ok = c.nonEmpty ? !!(v && v.trim()) : v === c.equals;
          if (!ok) msg = c.sel + ' has ' + (v == null ? 'no ' + c.name + ' at all' : c.name + '="' + v + '"') +
            (c.equals != null ? ', expected "' + c.equals + '"' : '') + '.';
        }
      } else if (c.kind === 'style') {
        const el = one(c.sel);
        if (!el) { ok = false; msg = 'There is no ' + c.sel + ' to style yet.'; }
        else {
          const v = win.getComputedStyle(el)[c.prop];
          const wanted = c.oneOf || [c.equals];
          ok = wanted.indexOf(v) >= 0;
          if (!ok) msg = 'The ' + c.prop + ' of ' + c.sel + ' is ' + v + ', expected ' + wanted.join(' or ') + '.';
        }
      } else if (c.kind === 'styleNot') {
        const el = one(c.sel);
        if (!el) { ok = false; msg = 'There is no ' + c.sel + ' yet.'; }
        else {
          const v = win.getComputedStyle(el)[c.prop];
          ok = v !== c.equals;
          if (!ok) msg = 'The ' + c.prop + ' of ' + c.sel + ' is still ' + v + '.';
        }
      } else if (c.kind === 'sideBySide') {
        const els = all(c.sel);
        if (els.length < 2) { ok = false; msg = 'Need at least two ' + c.sel + ' to compare.'; }
        else {
          const a = els[0].getBoundingClientRect(), b = els[1].getBoundingClientRect();
          ok = b.left >= a.right - 1 && Math.abs(a.top - b.top) < 2;
          if (!ok) msg = 'Those boxes are still stacked one under the other rather than sitting in a row.';
        }
      } else if (c.kind === 'stacked') {
        const els = all(c.sel);
        if (els.length < 2) { ok = false; msg = 'Need at least two ' + c.sel + ' to compare.'; }
        else {
          const a = els[0].getBoundingClientRect(), b = els[1].getBoundingClientRect();
          ok = b.top >= a.bottom - 1;
          if (!ok) msg = 'Those boxes are side by side rather than stacked.';
        }
      } else if (c.kind === 'inside') {
        ok = !!one(c.sel);
        if (!ok) msg = 'Nothing matches ' + c.sel + '. Check what is nested inside what.';
      } else if (c.kind === 'outerWidth') {
        const el = one(c.sel);
        if (!el) { ok = false; msg = 'There is no ' + c.sel + ' yet.'; }
        else {
          const w = el.getBoundingClientRect().width;
          ok = Math.abs(w - c.px) <= (c.tolerance || 1);
          if (!ok) msg = c.sel + ' measures ' + Math.round(w) + 'px on screen, expected ' + c.px + 'px.';
        }
      } else if (c.kind === 'widthAtLeast') {
        const el = one(c.sel);
        ok = !!el && el.getBoundingClientRect().width >= c.px;
        if (!ok) msg = c.sel + ' is narrower than ' + c.px + 'px.';
      }
    } catch (e) { ok = false; msg = 'That check could not run: ' + e.message; }
    results.push({ ok, msg, label: c.msg || '' });
  }
  return results;
}

function markupDocument(html, css) {
  return '<!doctype html><html><head><meta charset="utf-8"><style>\n' + (css || '') + '\n</style></head><body>\n' + (html || '') + '\n</body></html>';
}

  async set(k, v){
    if(window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
  }
};

function findCommentStart(line, marker){
  let q = null;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){ if(c === '\\') i++; else if(c === q) q = null; continue; }
    if(c === '"' || c === "'"){ q = c; continue; }
    if(line.startsWith(marker, i)) return i;
  }
  return -1;
}
function highlight(line, lang){
  const marker = (POLYGLOT.SPECS[lang] || {}).comment || '#';
  const ci = findCommentStart(line, marker);
  const code = ci >= 0 ? line.slice(0, ci) : line;
  const tail = ci >= 0 ? line.slice(ci) : '';
  const parts = [];
  const re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|\b\d+(?:\.\d+)?\b|[A-Za-z_][A-Za-z0-9_]*)/g;
  let last = 0, m;
  while((m = re.exec(code))){
    if(m.index > last) parts.push(esc(code.slice(last, m.index)));
    const t = m[0];
    if(t[0] === '"' || t[0] === "'") parts.push('<span class="tok-str">'+esc(t)+'</span>');
    else if(/^\d/.test(t)) parts.push('<span class="tok-num">'+esc(t)+'</span>');
    else if((KEYWORDS[lang]||[]).includes(t)) parts.push('<span class="tok-kw">'+esc(t)+'</span>');
    else if((BUILTINS[lang]||[]).includes(t)) parts.push('<span class="tok-bi">'+esc(t)+'</span>');
    else parts.push(esc(t));
    last = m.index + t.length;
  }
  parts.push(esc(code.slice(last)));
  if(tail) parts.push('<span class="tok-com">'+esc(tail)+'</span>');
  return parts.join('') || '&nbsp;';
}

    return '<div class="row'+cls+'"><div class="n">'+n+'</div><div class="src">'+highlight(l,displayLang())+'</div></div>';
  }).join('');
}

   The interpreter cannot pause, so each time you type we run the whole
   program again from the start with every answer you have given so far.
   Deterministic programs make that exact. */
function wantsInput(src, lang){
  try{ return /\binput\b/.test(JSON.stringify(POLYGLOT.parse(src, lang))); }
  catch(e){ return false; }
}
function renderPlay(){
  const box = $('playPanel');

  let r;
  try{ r = POLYGLOT.execute(S.code, S.lang, { inputs: S.inputs.slice(), maxSteps: 200000, maxTrace: 1 }); }
  catch(e){ $('playOut').innerHTML = '<span class="said">'+esc(e.message||String(e))+'</span>'; return; }
  const lines = r.output.map(l=>esc(l));
  if(r.waiting) lines.push('<span class="said">\u2026waiting for you</span>');
  else if(r.error) lines.push('<span class="said">'+esc(r.error.message)+'</span>');
  else lines.push('<span class="done">The end.</span>');
  $('playOut').innerHTML = lines.join('\n');

function renderStepbar(){

  $('stepbar').style.display = on ? 'flex' : 'none';

function renderOutput(){
  const p = $('panelOut');
  if(!S.result){ p.innerHTML = '<div class="empty">Nothing has run yet.</div>'; return; }
  const r = S.result;
  // every line is shown immediately; the marker just tracks where stepping has reached
  const reached = ($('stepbar').style.display !== 'none' && r.trace.length)
    ? r.trace[Math.min(S.step, r.trace.length-1)].outputLen : r.output.length;
  let html = r.output.length
    ? r.output.map((l,i)=>'<div class="outline'+(i === reached-1 ? ' justprinted' : '')+'">'+esc(l)+'</div>').join('')
    : '<div class="empty">This program printed nothing.</div>';
  if(r.error) html += '<div class="errbox" style="margin-top:10px"><b>'+esc(r.error.message)+'</b>'+(r.error.hint?'<span>'+esc(r.error.hint)+'</span>':'')+'</div>';

function renderVars(){
  const p = $('panelVars');
  if(!S.result || !S.result.trace.length){ p.innerHTML = '<div class="empty">Run a program, then step through it to watch values change.</div>'; return; }
  const i = Math.min(S.step, S.result.trace.length-1);
  const t = S.result.trace[i], prev = i > 0 ? S.result.trace[i-1] : null;
  const slab = (k,v,ch)=>'<div class="slab'+(ch?' changed':'')+'"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>';
  let html = '<div class="framelabel">'+(t.frame === 'main' ? 'Top level' : 'Inside '+esc(t.frame))+
    (t.depth>1?', '+(t.depth-1)+' call'+(t.depth>2?'s':'')+' deep':'')+'</div>';
  const keys = Object.keys(t.vars);
  html += keys.length ? keys.map(k=>{
      const v = POLYGLOT.fmt(t.vars[k], S.lang);
      const ch = prev && prev.frame === t.frame && POLYGLOT.fmt(prev.vars[k], S.lang) !== v;
      return slab(k, v, ch);
    }).join('') : '<div class="empty">No values here yet.</div>';
  if(t.globals){
    html += '<div class="framelabel" style="margin-top:12px">main</div>';
    html += Object.keys(t.globals).map(k=>slab(k, POLYGLOT.fmt(t.globals[k], S.lang), false)).join('') || '<div class="empty">No variables yet.</div>';
  }
  p.innerHTML = html;
}

/* Questions drawn from work already finished, so it stays fresh without new lessons. */
function reviewPool(){
  const out = [];
  for(const les of LESSONS){
    if((les.unavailable || []).indexOf(S.lang) >= 0) continue;
    for(const t of les.tasks){
      if(!t.solution || !progressOf(t.id).done) continue;
      out.push({ id:t.id, src: GAME.solutionFor(t, S.lang, POLYGLOT) });
    }
  }
  return out;
}
function startDrill(){
  S.drillMode = true; S.reviewMode = false;
  const day = Math.floor(Date.now() / 86400000);
  const round = S.quiz && S.quiz.drill ? S.quiz.round + 1 : 0;
  const qs = GAME.makeRecognitionRound(RECOGNISE, PATTERN_NAMES, day * 31 + round * 7 + 3, 5);
  S.quiz = { questions:qs, i:0, answered:false, correct:0, round:round, drill:true };
  setPhase('predict');
}

function startReview(){
  const pool = reviewPool();
  S.reviewMode = true;
  const day = Math.floor(Date.now() / 86400000);
  const rnd = GAME.mulberry32(day * 7919 + pool.length);
  const picked = [];
  const seen = {};
  for(let guard = 0; guard < 60 && picked.length < 5 && pool.length; guard++){
    const i = Math.floor(rnd() * pool.length);
    if(seen[i]) continue;
    seen[i] = 1;
    const want = pool.length < 5 ? 2 : 1;   // a small pool still deserves a full round
    const qs = GAME.makeQuestions(pool[i].src, S.lang, day + i * 31, want, POLYGLOT);
    for(const q of qs){ if(picked.length < 5) picked.push(q); }
  }
  S.quiz = { questions:picked, i:0, answered:false, correct:0, round:0 };
  setPhase('predict');
}

function startQuiz(){
  const round = S.quiz ? S.quiz.round + 1 : 0;
  const seedBase = S.lessonIndex * 977 + round * 31 + 7;
  const pool = [demoSource()];
  for(const task of L().tasks){
    if(!task.solution) continue;
    pool.push(GAME.solutionFor(task, S.lang, POLYGLOT));
  }
  let qs = [];
  for(let i=0;i<pool.length && qs.length<3;i++){
    qs = qs.concat(GAME.makeQuestions(pool[i], S.lang, seedBase + i * 13, 3 - qs.length, POLYGLOT));
  }
  S.quiz = { questions:qs, i:0, answered:false, correct:0, round:round };
  renderQuestion();
}
function renderQuestion(){
  S.result = null; S.runTarget = 'build';
  $('readout').style.display = 'none';
  renderStepbar();
  if(!S.quiz.questions.length){
    $('qPrompt').textContent = 'No questions for this one.';
    paintCode($('qCode'), demoSource(), 0, 0);
    $('qOptions').innerHTML = '';
    $('qVerdict').innerHTML = '<div class="verdict"><p>' + (readOnly()
      ? POLYGLOT.SPECS[S.viewLang].name + ' cannot express this lesson, so there is nothing to predict. ' + availableSentence()
      : 'This lesson\u2019s programs are too short to ask about. Head to Build.') + '</p></div>';
    $('btnQNext').disabled = true;
    return;
  }
  const q = S.quiz.questions[S.quiz.i];
  if(!q){ renderQuizDone(); return; }
  const isDrill = q.type === 'recognise';
  $('qPrompt').innerHTML = '<span class="eyebrow" style="display:block;margin-bottom:4px">Question ' + (S.quiz.i+1) +
    ' of ' + S.quiz.questions.length + '</span>' + esc(isDrill ? 'Which technique fits this problem?' : q.prompt);
  $('qCode').parentElement.style.display = isDrill ? 'none' : 'block';

  $('qVerdict').innerHTML = '';

  S.quiz.answered = false;
}
function answerQuestion(i){
  if(S.quiz.answered) return;
  const q = S.quiz.questions[S.quiz.i];
  S.quiz.answered = true;
  const right = i === q.answer;
  $('qOptions').querySelectorAll('.opt').forEach((b,bi)=>{
    b.disabled = true;
    if(bi === q.answer) b.classList.add('right');
    else if(bi === i) b.classList.add('wrong');
  });
  if(right){ S.quiz.correct++; S.streak++; award(10 + Math.min(S.streak,5) * 2); }
  else S.streak = 0;
  $('qVerdict').innerHTML = '<div class="verdict '+(right?'right':'wrong')+'"><b>'+(right?'Right.':'Not this time.')+'</b><p>'+
    (right ? '' : 'The answer is: ' + esc(q.options[q.answer]) + '. ') + esc(q.explain) + '</p>'+
    (q.stepIndex != null ? '<button class="ghost" id="btnStepIt" style="margin-top:9px">Step to that moment</button>' : '')+
    '</div>';

  catch(e){ S.code = (POLYGLOT.SPECS[S.lang].comment || '#') + ' ' + (e.message || 'Not available in this language.'); }
  if(S.editing) setEditing(false);

function doCheck(){
  const t = T();
  if(!t.expect) return;
  if(S.editing) setEditing(false);
  runSource(S.code, 'build', t.inputs);
  const r = S.result;
  if(r.error && r.error.waiting){
    r.checked = { pass:false, html:'<div class="errbox" style="margin-top:10px"><b>It is still waiting for input</b>'+
      '<span>This task supplies '+((t.inputs||[]).length)+' answer'+(((t.inputs||[]).length)===1?'':'s')+
      '. Asking for more than that means the loop is not ending when it should.</span></div>' };
    renderOutput(); return;
  }
  if(r.error){
    r.checked = { pass:false, html:'<div class="errbox" style="margin-top:10px"><b>It stopped before finishing</b><span>Fix the problem above, then check again.</span></div>' };
    renderOutput(); return;
  }
  const norm = a => a.map(x=>String(x).replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null'));
  const got = norm(r.output), want = norm(t.expect);
  let msg = null;
  for(let i=0;i<Math.max(got.length,want.length);i++){
    if(got[i] !== want[i]){
      if(i >= got.length) msg = 'Output line ' + (i+1) + ' is missing. It should be: ' + want[i];
      else if(i >= want.length) msg = 'There is an extra output line: ' + got[i];
      else msg = 'Output line ' + (i+1) + ' was "' + got[i] + '" but should be "' + want[i] + '".';
      break;
    }
  }
  if(msg){
    r.checked = { pass:false, html:'<div class="errbox" style="margin-top:10px"><b>Not there yet</b><span>'+esc(msg)+'</span></div>' };
    renderOutput(); return;
  }
  let stars = S.revealed ? 1 : (S.hintLevel > 0 ? 2 : 3);
  let craftNote = '';
  if(t.craft && stars === 3){
    let res = null;
    try{ res = GAME.checkCraft(t.craft, POLYGLOT.parse(S.code, S.lang)); }catch(e){}
    if(res && !res.pass){ stars = 2; craftNote = 'For the third star: ' + res.label.toLowerCase() + '.'; }
    else if(res && res.pass) craftNote = res.label + '.';
  }
  let speedNote = '', speedOk = true;
  if(t.speed){
    const g = GAME.measureGrowth(S.code, S.lang, t.speed, POLYGLOT);
    if(!g.ok) speedNote = '<span class="empty">Speed could not be measured: '+esc(g.reason)+'</span>';
    else {
      speedOk = g.pass;
      speedNote = '<span class="empty">'+esc(g.label)+'. '+esc(g.verdict)+
        ' (' + g.counts[0] + ' steps at ' + g.sizes[0] + ', ' + g.counts[1] + ' at ' + g.sizes[1] + ')</span>';
      if(!g.pass) stars = Math.min(stars, 1);
    }
  }
  const prev = progressOf(t.id);
  if(stars > prev.stars) award((stars - prev.stars) * 10);
  S.progress[t.id] = { stars: Math.max(stars, prev.stars), done:true };
  saveProgress();
  r.checked = { pass:true, html:'<div class="'+(speedOk?'okbox':'errbox')+'" style="margin-top:10px"><b>'+
    (speedOk ? 'Correct.' : 'Correct, but too slow.')+'</b>'+
    '<div class="stars">'+starStr(stars)+'</div>'+
    (craftNote?'<span class="empty">'+esc(craftNote)+'</span>':'')+speedNote+'</div>' };
  renderOutput(); renderBuild(); renderLessonList(); renderScore();
}
function doHint(){
  const t = T();

function doReveal(){

const ML = () => MARKUP_LESSONS[S.mLesson];

function renderPreview(html, css){
  // Reassigning srcdoc while the previous srcdoc navigation is still in flight
  // leaves the OLD document on screen for good, even though the attribute reads
  // as the new one (seen in Chromium 152). Replacing the frame always lands on
  // the newest content, which is what a live preview has to guarantee.
  const f = $('mPreview');
  const n = f.cloneNode(false);
  n.srcdoc = markupDocument(html, css);
  f.replaceWith(n);
}

  $('mDots').innerHTML = ML().tasks.map((x,i)=>

  $('mReveal').style.display = S.mHint >= (t.hints||[]).length ? 'inline-block' : 'none';
  $('mHintBox').innerHTML = S.mHint
    ? '<div class="hintbox">'+(t.hints||[]).slice(0,S.mHint).map(h=>'<div>'+esc(h)+'</div>').join('')+'</div>' : '';
  renderPreview(S.mHtml, S.mCss);
}
function markupCheck(){
  const t = MT();
  const f = $('mPreview');
  const run = () => {
    let results;
    try{ results = runMarkupChecks(f.contentDocument, f.contentWindow, t.checks); }
    catch(e){ $('mChecks').innerHTML = '<div class="checkrow fail"><i>x</i><span>'+esc(e.message)+'</span></div>'; return; }
    const passed = results.every(r=>r.ok);
    $('mChecks').innerHTML = results.map((r,i)=>
      '<div class="checkrow '+(r.ok?'pass':'fail')+'"><i>'+(r.ok?'\u2713':'\u2717')+'</i><span>'+
      esc(r.ok ? (t.checks[i].msg || 'passes') : r.msg)+'</span></div>').join('');
    if(passed){
      const stars = S.mRevealed ? 1 : (S.mHint > 0 ? 2 : 3);
      const prev = progressOf(t.id);
      if(stars > prev.stars) award((stars - prev.stars) * 10);
      S.progress[t.id] = { stars: Math.max(stars, prev.stars), done:true };
      saveProgress();
      $('mChecks').innerHTML = '<div class="okbox"><b>Correct.</b><div class="stars">'+starStr(stars)+'</div></div>' + $('mChecks').innerHTML;
      renderMarkup(); renderLessonList();
    }
  };
  // the preview reloads on every keystroke, so wait for the current document
  if(f.contentDocument && f.contentDocument.readyState === 'complete') run();
  else f.onload = () => { f.onload = null; run(); };
}

    else if(S.reviewMode || S.drillMode){ $('btnQNext').textContent = 'Next'; renderQuestion(); }
    else { $('btnQNext').textContent = 'Next'; startQuiz(); }

  if(p === 'build') loadTask(S.taskIndex);

function lessonDone(i){ return LESSONS[i].tasks.every(t => !t.expect || progressOf(t.id).done); }
function unlocked(i){
  if(i === 0 || LESSONS[i].id === 'sandbox') return true;
  return lessonDone(i-1);
}
function loadLesson(i){
  if(!unlocked(i)) return;
  S.track = 'code';
  S.lessonIndex = i; S.taskIndex = 0; S.quiz = null;
  $('lessonEyebrow').textContent = LESSONS[i].id === 'sandbox' ? 'Free play' : ('Lesson ' + (i+1) + ' of ' + (LESSONS.length-1));
  $('lessonTitle').textContent = LESSONS[i].title;
  $('lessonIdea').textContent = LESSONS[i].idea;
  renderKnown(LESSONS[i].known);

}

function lessonCard(les, i, lock){
  const stars = les.tasks.reduce((a,t)=>a + progressOf(t.id).stars, 0);
  const max = les.tasks.filter(t=>t.expect).length * 3;
  return '<button class="lessonitem" data-i="'+i+'"'+(S.track==='code'&&i===S.lessonIndex?' aria-current="true"':'')+' data-locked="'+lock+'">'+
    '<div class="t">'+esc(les.title)+'</div>'+
    '<div class="g">'+(lock ? 'Finish the lesson before this one' : esc(les.idea))+'</div>'+
    (max && !lock ? '<div class="st">'+stars+' of '+max+' stars</div>' : '')+
    '</button>';
}

function renderLessonList(){
  const markup = '<div class="eyebrow" style="margin:22px 0 4px"><span style="font-size:17px;font-weight:750">HTML and CSS</span></div>' + MARKUP_LESSONS.map((les,i)=>{
    const stars = les.tasks.reduce((a,t)=>a + progressOf(t.id).stars, 0);
    return '<button class="lessonitem" data-m="'+i+'"'+(S.track==='markup'&&i===S.mLesson?' aria-current="true"':'')+'>'+
      '<div class="t">'+esc(les.title)+'</div><div class="g">'+esc(les.idea)+'</div>'+
      '<div class="st">'+stars+' of '+(les.tasks.length*3)+' stars</div></button>';
  }).join('');
  const ORDER = ['Basics','Intermediate','Advanced','Mastery','Problems','Project','Free play'];
  const BLURB = {
    'Basics':'You can read a short program and say what it prints.',
    'Intermediate':'You can write loops, lists, dictionaries and functions without help.',
    'Advanced':'You can find a bug from an error message and survive a failure.',
    'Mastery':'You can read a class hierarchy in any of these languages.',
    'Problems':'You can spot the pattern behind an interview question and hit the speed it needs.',
    'Project':'You built a game from nothing and it is yours to keep.'
  };
  const groups = {};
  LESSONS.forEach((les,i)=>{ (groups[les.level] = groups[les.level] || []).push([les,i]); });
  const done = lvl => (groups[lvl]||[]).every(([les,i]) => lessonDone(i));
  const finished = LESSONS.reduce((a,les)=>a + les.tasks.filter(t=>t.solution && progressOf(t.id).done).length, 0);
  let html = '<button class="lessonitem" id="btnReview"'+(finished?'':' data-locked="true"')+'>'+
    '<div class="t">Daily review</div><div class="g">'+
    (finished ? 'Fresh questions drawn from the ' + finished + ' task' + (finished===1?'':'s') + ' you have finished'
              : 'Finish a task first and this fills up') + '</div></button>';
  html += '<button class="lessonitem" id="btnDrill">'+
    '<div class="t">Spot the pattern</div>'+
    '<div class="g">Five problems and no code to write. Name the technique each one needs.</div></button>';
  for(const lvl of ORDER){
    if(!groups[lvl]) continue;
    const total = groups[lvl].reduce((a,[les])=>a + les.tasks.filter(t=>t.expect).length*3, 0);
    const got = groups[lvl].reduce((a,[les])=>a + les.tasks.reduce((b,t)=>b+progressOf(t.id).stars,0), 0);
    html += '<div class="eyebrow" style="display:flex;justify-content:space-between;align-items:baseline;margin:'+(html?'22px':'6px')+' 0 4px">'+
      '<span style="font-size:17px;font-weight:750">'+esc(lvl)+'</span>'+
      (total ? '<span style="color:'+(done(lvl)?'var(--good)':'var(--slate)')+'">'+got+' of '+total+' stars</span>' : '')+'</div>';
    html += groups[lvl].map(([les,i])=>lessonCard(les, i, !unlocked(i))).join('');
    if(done(lvl) && BLURB[lvl]) html += '<div class="levelblurb">'+esc(BLURB[lvl])+'</div>';
  }
  $('lessonList').innerHTML = html + markup;
}
function switchLang(to){
  if(to === displayLang()) return;
  const spec = POLYGLOT.SPECS[to];
  // a lesson this language cannot express is shown, explained, and not run
  if(S.track === 'code' && (L().unavailable || []).indexOf(to) >= 0){
    S.viewLang = to;
    $('langSel').value = to;
    S.result = null; S.step = 0;
    if(S.editing) setEditing(false);
    if(S.phase === 'learn') renderLearn();
    if(S.phase === 'predict') setPhase('predict');
    if(S.phase === 'build') renderBuild();
    renderViewNote(); renderStepbar(); renderOutput(); renderVars(); renderCompare();
    return;
  }
  if(spec && spec.viewOnly){
    S.viewLang = to;
    $('langSel').value = to;
    S.result = null; S.step = 0;
    if(S.editing) setEditing(false);
    if(S.phase === 'learn') renderLearn();
    if(S.phase === 'predict') setPhase('predict');
    if(S.phase === 'build') renderBuild();
    renderViewNote(); renderStepbar(); renderOutput(); renderVars();
    return;
  }
  S.viewLang = null;
  if(to === S.lang){
    $('langSel').value = to;
    if(S.phase === 'learn') renderLearn();
    if(S.phase === 'build') renderBuild();
    if(S.phase === 'predict') setPhase('predict');
    renderViewNote(); renderStepbar(); renderOutput(); renderVars();
    return;
  }
  const prev = S.lang;
  if(S.phase === 'build'){
    if(S.editing) setEditing(false);
    const atStarter = S.code.trim() === GAME.starterFor(T(), prev, POLYGLOT).trim();
    if(atStarter){ S.lang = to; S.code = GAME.starterFor(T(), to, POLYGLOT); }
    else{
      let translated;
      try{ translated = POLYGLOT.translate(S.code, prev, to); }
      catch(e){
        S.result = { output:[], trace:[], steps:0, checked:null,
          error:{ message:'Can\u2019t switch language until this program parses: ' + (e.message||String(e)), line:e.line||0, hint:e.hint||'' } };
        S.runTarget = 'build'; selectTab('out'); renderRunUI();
        $('langSel').value = prev;
        return;
      }
      S.lang = to; S.code = translated;
    }
  } else S.lang = to;
  $('langSel').value = to;
  renderTokens();
  S.result = null; S.step = 0;
  if(S.phase === 'learn') renderLearn();
  if(S.phase === 'predict') startQuiz();
  if(S.phase === 'build') renderBuild();
  renderViewNote(); renderCmpOptions(); renderStepbar(); renderOutput(); renderVars(); renderCompare();
}

function editorKeys(ta, onChange){
  ta.addEventListener('keydown', e=>{
    const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
    if(e.key === 'Enter'){
      const lineStart = v.lastIndexOf('\n', a - 1) + 1;
      const line = v.slice(lineStart, a);
      let pad = (line.match(/^[ \t]*/) || [''])[0];
      if(/[:{]\s*$/.test(line)) pad += (S.lang === 'python' ? '    ' : '  ');
      e.preventDefault();
      const ins = '\n' + pad;
      ta.value = v.slice(0, a) + ins + v.slice(b);
      ta.setSelectionRange(a + ins.length, a + ins.length);
      onChange(ta.value);
      return;
    }
    const pairs = { '(': ')', '[': ']', '{': '}', '"': '"' };
    if(pairs[e.key] && a === b){
      e.preventDefault();
      const ins = e.key + pairs[e.key];
      ta.value = v.slice(0, a) + ins + v.slice(b);
      ta.setSelectionRange(a + 1, a + 1);
      onChange(ta.value);
      return;
    }
    if([')',']','}','"'].includes(e.key) && a === b && v[a] === e.key){
      e.preventDefault();
      ta.setSelectionRange(a + 1, a + 1);
    }
  });
}

/* Appearance: 'system' follows the phone, 'light' and 'dark' override it. */
const PAPER = { light: '#F2F4F7', dark: '#151A23' };
function applyTheme(choice){
  const root = document.documentElement;
  if(choice === 'light' || choice === 'dark') root.dataset.theme = choice; else delete root.dataset.theme;
  // the browser bar colour follows too: forced themes pin both metas, 'system' restores their media queries
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    const own = /dark/.test(m.getAttribute('media') || '') ? 'dark' : 'light';
    m.setAttribute('content', PAPER[(choice === 'light' || choice === 'dark') ? choice : own]);
  });
  document.querySelectorAll('.themepick button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.themeChoice === (choice || 'system'))));
}
async function setTheme(choice){
  applyTheme(choice);
  try{ localStorage.setItem('polyglot:theme', choice); }catch(e){}
  try{ await STORE.set('polyglot:theme', choice); }catch(e){}
}
document.querySelectorAll('.themepick button').forEach(b => { b.onclick = () => setTheme(b.dataset.themeChoice); });
applyTheme(document.documentElement.dataset.theme || 'system');
(async () => {                       // inside an artifact the saved choice only arrives here
  try{ const v = await STORE.get('polyglot:theme'); if(v) applyTheme(v); }catch(e){}
})();

loadProgress();
